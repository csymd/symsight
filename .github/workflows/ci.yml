# Day-to-day CI for symsight (Python / uv + Rust workspace).
#
# Branch model (same as SymWorx / SymKit):
#   develop → stage → release/vX.Y.Z → main → manual tag vX.Y.Z
#
# Day-to-day CI on develop only. stage/main are FF promotions of that SHA.
# Tag / release.yml re-runs the full gate before publish.
# workflow_dispatch re-runs this gate on a branch (checks only; no publish).

name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dev tools
        run: uv sync --extra dev

      - name: Ruff check
        run: uv run ruff check src tests

  test:
    name: Pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync project + test deps
        run: uv sync --extra test --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest

  test-python:
    name: Pytest python fallback (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      SYMSIGHT_IMPL: python
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync project + test + legacy deps
        run: uv sync --extra test --extra legacy --python ${{ matrix.python-version }}

      - name: Run tests (Python fallback)
        run: uv run --python ${{ matrix.python-version }} pytest

  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly Rust (rustfmt)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo +nightly fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

  # Aggregate gate for branch protection / required checks
  ci-ready:
    name: CI checks passed
    runs-on: ubuntu-latest
    needs: [lint, test, test-python, rust]
    if: always()
    steps:
      - name: Require all CI jobs
        run: |
          set -euo pipefail
          echo "lint: ${{ needs.lint.result }}"
          echo "test: ${{ needs.test.result }}"
          echo "test-python: ${{ needs.test-python.result }}"
          echo "rust: ${{ needs.rust.result }}"
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.test.result }}" = "success"
          test "${{ needs.test-python.result }}" = "success"
          test "${{ needs.rust.result }}" = "success"
          echo "All CI jobs passed."
