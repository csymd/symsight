# Release validation + publish (same branch model as SymWorx / SymKit).
#
# Branch model:
#   develop → stage → release/vX.Y.Z → main → manual tag vX.Y.Z
#
# Validation (meta, ruff, pytest, rust, manylinux wheel, native binary) runs on:
#   - PRs into main
#   - pushes to release/**
#   - tags v*
#   - workflow_dispatch (checks only; does not publish)
#
# Push to main is not a trigger: the PR into main already ran this workflow.
#
# Publish (GitHub Release with manylinux wheel/sdist + linux x86_64 binary)
# runs only on tags v*, after validation succeeds. Create tags manually after
# merging release/* → main.
#
# PyPI publish is paused until a trusted publisher is configured.

name: Release

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "release/**"
    tags:
      - "v*"
  # Re-run validation on a branch without publishing.
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Metadata: version / changelog / branch conventions for the release path
  # ---------------------------------------------------------------------------
  release-meta:
    name: Release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      is_tag: ${{ steps.meta.outputs.is_tag }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          PKG_VERSION=$(
            python3 - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("Cargo.toml").read_text())
          print(data["workspace"]["package"]["version"])
          PY
          )
          if [[ -z "${PKG_VERSION}" ]]; then
            echo "::error::Could not read workspace.package.version from Cargo.toml"
            exit 1
          fi
          echo "package_version=${PKG_VERSION}"

          IS_TAG=false
          IS_PRERELEASE=false
          TAG_VERSION=""
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            IS_TAG=true
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "${TAG_VERSION}" == *-* ]]; then
              IS_PRERELEASE=true
            fi
          fi

          # release/vX.Y.Z branch naming (push or PR head)
          BRANCH_REF="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          if [[ "${BRANCH_REF}" == release/* ]]; then
            BRANCH_VERSION="${BRANCH_REF#release/}"
            BRANCH_VERSION="${BRANCH_VERSION#v}"
            if [[ "${BRANCH_VERSION}" != "${PKG_VERSION}" ]]; then
              echo "::error::release branch '${BRANCH_REF}' version (${BRANCH_VERSION}) does not match Cargo.toml workspace version (${PKG_VERSION})"
              exit 1
            fi
          fi

          if [[ "${IS_TAG}" == "true" ]]; then
            if [[ "${TAG_VERSION}" != "${PKG_VERSION}" ]]; then
              echo "::error::Tag v${TAG_VERSION} does not match Cargo.toml workspace version ${PKG_VERSION}"
              exit 1
            fi
            # Final releases should land on main; pre-releases may come from stage.
            if [[ "${IS_PRERELEASE}" != "true" ]]; then
              git fetch --no-tags origin main:refs/remotes/origin/main 2>/dev/null || true
              if git rev-parse --verify origin/main >/dev/null 2>&1; then
                if git merge-base --is-ancestor HEAD origin/main 2>/dev/null; then
                  echo "Tag commit is on main (or an ancestor of main)."
                else
                  echo "::warning::Tag v${TAG_VERSION} is not an ancestor of main. Final releases should be cut after merging release/* → main."
                fi
              else
                echo "::warning::Branch 'main' does not exist yet; skipping main-ancestor check for tag v${TAG_VERSION}."
              fi
            fi
          fi

          # CHANGELOG: require a heading for this version (final and pre-release tags,
          # and release/* branches). Keep Unreleased PRs to main flexible.
          if [[ "${IS_TAG}" == "true" || "${BRANCH_REF}" == release/* ]]; then
            if ! grep -Eq "^## \[${PKG_VERSION}\]" CHANGELOG.md; then
              echo "::error::CHANGELOG.md missing '## [${PKG_VERSION}]' section for this release"
              exit 1
            fi
          fi

          {
            echo "version=${PKG_VERSION}"
            echo "is_tag=${IS_TAG}"
            echo "is_prerelease=${IS_PRERELEASE}"
          } >> "${GITHUB_OUTPUT}"

          echo "Release metadata: version=${PKG_VERSION} is_tag=${IS_TAG} is_prerelease=${IS_PRERELEASE}"
          if [[ "${IS_TAG}" == "true" ]]; then
            echo "Tag push: publish jobs will run after validation succeeds."
          else
            echo "Branch/PR: validation only (publish runs on tags v* only)."
          fi

  # ---------------------------------------------------------------------------
  # Validation
  # ---------------------------------------------------------------------------
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    needs: release-meta
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dev tools
        run: uv sync --extra dev

      - name: Ruff check
        run: uv run ruff check src tests

  test:
    name: Pytest
    runs-on: ubuntu-latest
    needs: release-meta
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync project + test deps
        run: uv sync --extra test

      - name: Run tests
        run: uv run pytest

  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    needs: release-meta
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install nightly Rust (rustfmt)
        uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
        with:
          components: rustfmt

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: rustfmt
        run: cargo +nightly fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

  build:
    name: Build manylinux wheel + sdist
    runs-on: ubuntu-latest
    needs: release-meta
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build sdist + manylinux wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: build
          args: --release --out dist --sdist
          manylinux: auto
          rust-toolchain: stable

      - name: List artifacts
        run: ls -la dist/

      - name: Upload wheel/sdist artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-v${{ needs.release-meta.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  build-native:
    name: Build linux x86_64 binary
    runs-on: ubuntu-latest
    needs: release-meta
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build clap binary
        run: cargo build -p symsight-cli --release

      - name: Strip and name artifact
        run: |
          set -euo pipefail
          strip target/release/symsight
          mkdir -p dist-native
          cp target/release/symsight \
            "dist-native/symsight-v${{ needs.release-meta.outputs.version }}-x86_64-unknown-linux-gnu"

      - name: Upload native binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-v${{ needs.release-meta.outputs.version }}
          path: dist-native/*
          if-no-files-found: error
          retention-days: 14

  # Aggregate gate used by branch protection / required checks
  release-ready:
    name: Release checks passed
    runs-on: ubuntu-latest
    needs: [release-meta, lint, test, rust, build, build-native]
    if: always()
    steps:
      - name: Require all validation jobs
        run: |
          set -euo pipefail
          echo "release-meta: ${{ needs.release-meta.result }}"
          echo "lint: ${{ needs.lint.result }}"
          echo "test: ${{ needs.test.result }}"
          echo "rust: ${{ needs.rust.result }}"
          echo "build: ${{ needs.build.result }}"
          echo "build-native: ${{ needs.build-native.result }}"
          test "${{ needs.release-meta.result }}" = "success"
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.test.result }}" = "success"
          test "${{ needs.rust.result }}" = "success"
          test "${{ needs.build.result }}" = "success"
          test "${{ needs.build-native.result }}" = "success"
          echo "All release validation jobs passed for v${{ needs.release-meta.outputs.version }}"
          echo "On tag pushes: github-release runs next (PyPI paused)."

  # ===========================================================================
  # Publish — only on tags v* after validation succeeds
  # ===========================================================================
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [release-meta, release-ready]
    if: needs.release-meta.outputs.is_tag == 'true' && needs.release-ready.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download wheel/sdist artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-v${{ needs.release-meta.outputs.version }}
          path: dist

      - name: Download native binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-v${{ needs.release-meta.outputs.version }}
          path: dist-native

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ needs.release-meta.outputs.version }}
          name: v${{ needs.release-meta.outputs.version }}
          prerelease: ${{ needs.release-meta.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          files: |
            dist/*
            dist-native/*

  # ---------------------------------------------------------------------------
  # PyPI publish — PAUSED. Validation still builds sdist/wheel artifacts.
  # Uncomment after configuring Environment `pypi` (trusted publishing).
  # ---------------------------------------------------------------------------
  # publish-pypi:
  #   name: Publish PyPI
  #   runs-on: ubuntu-latest
  #   needs: [release-meta, release-ready]
  #   if: needs.release-meta.outputs.is_tag == 'true' && needs.release-ready.result == 'success'
