[workspace]
resolver = "2"
members = [
    "crates/symsight-core",
    "crates/symsight-cli",
    "crates/symsight-py",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
authors = ["PalEm Dynamics LLC"]
repository = "https://github.com/csymd/symsight"
homepage = "https://github.com/csymd/symsight"
description = "Insight generator: articles and social posts with CLI and TUI"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
dotenvy = "0.15"
indexmap = { version = "2", features = ["serde"] }
pyo3 = { version = "0.23", features = ["abi3-py311"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
thiserror = "2"
toml = { version = "0.8", features = ["parse", "display"] }
